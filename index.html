<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영업보고서 참고자료 검색 시스템</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --accent: #06b6d4;
            --surface: #ffffff;
            --surface-alt: #f8fafc;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --highlight: #fef08a;
            --highlight-border: #fbbf24;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --sidebar-width: 320px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            height: 100vh;
            color: var(--text);
            background: var(--surface-alt);
            -webkit-font-smoothing: antialiased;
        }

        /* ── Sidebar ── */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 24px 24px 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .sidebar-brand .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar-brand h1 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }

        .sidebar-brand h1 small {
            display: block;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        /* Search */
        .search-wrapper {
            position: relative;
            margin-bottom: 6px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        #search-box {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-family: inherit;
            background: var(--surface-alt);
            color: var(--text);
            transition: all 0.2s;
            outline: none;
        }

        #search-box:focus {
            border-color: var(--primary-light);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        #search-box::placeholder {
            color: var(--text-muted);
        }

        /* Category list */
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px 12px;
        }

        .sidebar-nav::-webkit-scrollbar { width: 4px; }
        .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        ul { list-style: none; }

        .category-item > span {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-secondary);
            transition: all 0.15s;
            user-select: none;
        }

        .category-item > span:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .category-item > span .cat-icon {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .category-item > span .cat-count {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--surface-alt);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .category-item.active > span {
            background: linear-gradient(135deg, rgba(79,70,229,0.08), rgba(6,182,212,0.06));
            color: var(--primary);
        }

        .category-item.active > span .cat-icon {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
        }

        .category-item > span .chevron {
            transition: transform 0.2s;
            color: var(--text-muted);
            font-size: 12px;
        }

        .category-item.active > span .chevron {
            transform: rotate(90deg);
            color: var(--primary);
        }

        .year-list {
            display: none;
            padding: 4px 0 4px 50px;
        }

        .year-item > span {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            color: var(--text-secondary);
            transition: all 0.15s;
            position: relative;
        }

        .year-item > span::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
            transform: translateY(-50%);
            transition: background 0.15s;
        }

        .year-item > span:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .year-item.active > span {
            background: rgba(79,70,229,0.06);
            color: var(--primary);
            font-weight: 600;
        }

        .year-item.active > span::before {
            background: var(--primary);
        }

        .year-item > span .year-count {
            margin-left: auto;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Sidebar footer links */
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .sidebar-footer a {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.15s;
            background: var(--surface);
        }

        .sidebar-footer a:hover {
            border-color: var(--primary-light);
            color: var(--primary);
            background: rgba(79,70,229,0.04);
        }

        /* ── Main Content ── */
        #main-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        #main-content::-webkit-scrollbar { width: 6px; }
        #main-content::-webkit-scrollbar-track { background: transparent; }
        #main-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .content-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(248,250,252,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            padding: 20px 40px;
        }

        #content-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }

        .content-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .content-body {
            padding: 24px 40px 40px;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 40px;
            text-align: center;
        }

        .empty-state .empty-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(79,70,229,0.08), rgba(6,182,212,0.08));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.875rem;
            color: var(--text-muted);
            max-width: 320px;
            line-height: 1.6;
        }

        /* Detail cards */
        .details-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            transition: all 0.2s;
        }

        .detail-item:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .detail-item h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .detail-item .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .detail-item .meta span {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            font-size: 0.72rem;
            font-weight: 500;
            border-radius: 20px;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            background: var(--surface-alt);
        }

        .detail-item .meta span.badge-year {
            background: linear-gradient(135deg, rgba(79,70,229,0.08), rgba(79,70,229,0.04));
            border-color: rgba(79,70,229,0.2);
            color: var(--primary);
        }

        .detail-item .meta span.badge-category {
            background: linear-gradient(135deg, rgba(6,182,212,0.08), rgba(6,182,212,0.04));
            border-color: rgba(6,182,212,0.2);
            color: #0891b2;
        }

        .detail-item .content {
            font-size: 0.875rem;
            line-height: 1.75;
            color: var(--text-secondary);
        }

        .detail-item .content strong {
            display: block;
            margin-top: 14px;
            margin-bottom: 4px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .detail-item .content p {
            margin-bottom: 8px;
        }

        /* Structured content rendering */
        .detail-item .content .c-head {
            display: block;
            font-weight: 700;
            color: var(--text);
            margin: 14px 0 5px;
            padding-bottom: 3px;
            border-bottom: 1px solid var(--border-light);
        }
        .detail-item .content .c-head:first-child { margin-top: 0; }
        .detail-item .content .c-sub {
            display: block;
            font-weight: 600;
            margin: 11px 0 3px;
        }
        .detail-item .content .c-b1 {
            display: block;
            padding-left: 15px;
            text-indent: -15px;
            margin-bottom: 3px;
        }
        .detail-item .content .c-b2 {
            display: block;
            padding-left: 32px;
            text-indent: -15px;
            margin-bottom: 3px;
            color: var(--text-secondary);
        }
        .detail-item .content .c-b3 {
            display: block;
            padding-left: 50px;
            text-indent: -18px;
            margin-bottom: 3px;
        }
        .detail-item .content .c-note {
            display: block;
            padding-left: 15px;
            text-indent: -15px;
            margin: 4px 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .detail-item .content .c-line {
            display: block;
            margin-bottom: 3px;
        }
        /* 고시 조문 위계 들여쓰기: 조 > 항(①) > 호(1.) > 목(가.) > 세목(1)) */
        .detail-item .content .g-jo {
            display: block;
            font-weight: 700;
            margin: 6px 0 4px;
            color: var(--text);
        }
        .detail-item .content .g-hang,
        .detail-item .content .g-ho,
        .detail-item .content .g-mok,
        .detail-item .content .g-semok,
        .detail-item .content .g-body {
            display: block;
            margin-bottom: 4px;
            line-height: 1.72;
        }
        .detail-item .content .g-body  { margin-left: 0.4em; }
        .detail-item .content .g-hang  { margin-left: 0.4em;  padding-left: 1.5em; text-indent: -1.5em; }
        .detail-item .content .g-ho    { margin-left: 1.9em;  padding-left: 1.6em; text-indent: -1.6em; }
        .detail-item .content .g-mok   { margin-left: 3.4em;  padding-left: 1.6em; text-indent: -1.6em; }
        .detail-item .content .g-semok { margin-left: 4.9em;  padding-left: 1.8em; text-indent: -1.8em; }
        .detail-item .content .c-result {
            display: block;
            margin: 5px 0;
            padding: 4px 10px;
            background: #f6f9fd;
            border-left: 2px solid #b9d0e8;
            border-radius: 2px;
            color: var(--text);
        }
        .detail-item .content .c-part {
            display: block;
            font-weight: 700;
            margin: 16px 0 6px;
            padding: 5px 10px;
            background: #eef2f7;
            border-left: 3px solid #6b7c93;
            color: #33475b;
            border-radius: 2px;
        }
        .detail-item .content .c-part:first-child { margin-top: 0; }

        /* AI 질의 */
        .qa-open-btn {
            width: 100%;
            margin-top: 8px;
            padding: 7px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--primary);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all .15s;
        }
        .qa-open-btn:hover { background: var(--surface-alt); border-color: var(--primary); }
        .qa-panel textarea {
            width: 100%;
            height: 64px;
            padding: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 8px;
            resize: vertical;
        }
        .qa-panel .qa-ask {
            margin-top: 8px;
            padding: 8px 22px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .qa-panel .qa-ask:disabled { opacity: .5; cursor: wait; }
        .qa-answer {
            margin-top: 14px;
            padding: 12px 14px;
            background: var(--surface-alt);
            border-left: 3px solid var(--primary);
            border-radius: 0 6px 6px 0;
            white-space: pre-wrap;
            line-height: 1.75;
            font-size: 0.9rem;
        }
        .qa-refs { margin-top: 10px; font-size: 0.75rem; color: var(--text-muted); line-height: 1.7; }
        .qa-note { margin-top: 6px; font-size: 0.7rem; color: #b85c00; }
        .detail-item .content strong.c-key {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary);
            margin: 14px 0 5px;
            padding-bottom: 3px;
            border-bottom: 1px solid var(--border-light);
        }
        .detail-item .content strong.c-key:first-child { margin-top: 0; }
        .detail-item .content table.acmt-table {
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.78rem;
            width: 100%;
            background: var(--surface);
        }
        .detail-item .content table.acmt-table th,
        .detail-item .content table.acmt-table td {
            border: 1px solid var(--border);
            padding: 4px 7px;
            vertical-align: middle;
            text-align: center;
            color: var(--text);
        }
        .detail-item .content table.acmt-table th {
            background: var(--surface-alt);
            font-weight: 600;
        }
        .detail-item .content table.acmt-table tr:first-child td {
            background: var(--surface-alt);
            font-weight: 600;
        }
        .detail-item .content table.acmt-table td.rl {
            background: #fafbfd;
            font-weight: 600;
        }
        .detail-item .content table.acmt-table td.rl-result {
            background: #fff5e6;
            font-weight: 700;
            color: #b85c00;
        }
        .detail-item .content table.acmt-table .hl-red {
            color: #c0392b;
            font-weight: 700;
        }
        .detail-item .content img.acmt-figure {
            display: block;
            max-width: min(720px, 100%);
            max-height: 720px;
            height: auto;
            width: auto;
            object-fit: contain;
            margin: 10px 0;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            cursor: zoom-in;
        }
        .detail-item .content img.acmt-figure:hover {
            border-color: var(--primary);
        }

        .detail-item .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-light);
        }

        .detail-item .tags span {
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: 500;
            border-radius: 4px;
            background: var(--surface-alt);
            color: var(--text-muted);
        }

        .detail-item .source {
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .detail-item .source::before {
            content: "📄";
            font-size: 0.85rem;
        }
        .detail-item .source .src-label {
            font-weight: 500;
        }

        /* Search highlight */
        .search-results .detail-item mark {
            background: var(--highlight);
            border-bottom: 2px solid var(--highlight-border);
            padding: 0 2px;
            border-radius: 2px;
            color: inherit;
        }

        /* Result count badge */
        .result-count {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            margin-left: 10px;
            vertical-align: middle;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar {
                width: 100%;
                height: auto;
                max-height: 45vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .content-header { padding: 16px 20px; }
            .content-body { padding: 16px 20px 32px; }
        }
    </style>
</head>
<body>
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="logo">G</div>
                <h1>참고자료 검색<small>영업보고서 가이드라인</small></h1>
            </div>
            <div class="search-wrapper">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-box" placeholder="키워드로 검색 (2글자 이상)">
            </div>
            <button id="qa-open" class="qa-open-btn">&#129302; AI에게 질문 (로컬 Ollama)</button>
        </div>
        <ul id="category-list" class="sidebar-nav"></ul>
        <div class="sidebar-footer">
            <a href="data/[가이드라인]영업보고서 작성 참고자료_2023.04.pdf" target="_blank">&#128218; 가이드라인</a>
            <a href="data/[해설서]전기통신사업 회계분리기준 해설서_2026.04.pdf" target="_blank">&#128214; 해설서(2026.4)</a>
            <a href="data/[지침서]전기통신회계정보의분석표준화를위한전자표준지침서연구.pdf" target="_blank">&#128196; 표준지침서</a>
            <a href="data/[고시]전기통신사업 회계분리기준(과학기술정보통신부고시)(제2025-23호).pdf" target="_blank">&#9878; 고시</a>
        </div>
    </aside>

    <main id="main-content">
        <div class="content-header">
            <div id="content-title">데이터 로딩 중...</div>
            <div id="content-subtitle" class="content-subtitle"></div>
        </div>
        <div id="content-display" class="content-body">
            <div class="empty-state">
                <div class="empty-icon">&#9203;</div>
                <h3>데이터를 불러오는 중입니다</h3>
                <p>잠시만 기다려주세요.</p>
            </div>
        </div>
    </main>

    <script>
        // ★ 1. 데이터 파일 목록 관리
        const dataRegistry = {
            "영업보고서 검증결과 지적사항": { key: "gosi", years: [2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011], icon: "&#128269;", color: "#ef4444" },
            "질의 회신": { key: "qna", years: [2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011], icon: "&#128172;", color: "#3b82f6" },
            "회계전문위원회 회의 결과": { key: "acmt", years: [2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012], icon: "&#128101;", color: "#8b5cf6" },
            "회계처리 일원화 방안": { key: "acc", years: [2022, 2021, 2020, 2019, 2018, 2017, 2016, 2014], icon: "&#128203;", color: "#f59e0b" },
            "영업보고서 작성 주의사항": { key: "guide", years: [2019], icon: "&#9888;", color: "#10b981" },
            "회계분리기준 고시(조문)": { key: "rule", years: [2025], icon: "&#9878;", color: "#64748b" },
            "참고자료": { key: "ref", years: [null], icon: "&#128206;", color: "#06b6d4" }
        };

        let fullTableData = [];
        window.registerData = function(dataArray) {
            fullTableData.push(...dataArray);
        }

        // ★ 2. 데이터 파일 동적 로딩
        const filesToLoad = [];
        for (const category in dataRegistry) {
            const { key, years } = dataRegistry[category];
            years.forEach(year => {
                const yearStr = year === null ? 'data' : year;
                filesToLoad.push(`data/${key}_${yearStr}.js`);
            });
        }

        let filesLoaded = 0;
        function loadAllDataFiles(finalCallback) {
            if (filesToLoad.length === 0) { finalCallback(); return; }
            filesToLoad.forEach(fileUrl => {
                const script = document.createElement('script');
                script.src = fileUrl;
                script.onload = () => { filesLoaded++; if (filesLoaded === filesToLoad.length) finalCallback(); };
                script.onerror = () => { console.error(`Failed to load: ${fileUrl}`); filesLoaded++; if (filesLoaded === filesToLoad.length) finalCallback(); };
                document.head.appendChild(script);
            });
        }

        // ★ 3. UI 렌더링
        const categoryListEl = document.getElementById('category-list');
        const contentTitleEl = document.getElementById('content-title');
        const contentSubtitleEl = document.getElementById('content-subtitle');
        const contentDisplayEl = document.getElementById('content-display');
        const searchBoxEl = document.getElementById('search-box');
        let groupedData = {};

        // Click on acmt-figure opens the image in a new tab for full-size view
        document.addEventListener('click', function (ev) {
            const t = ev.target;
            if (t && t.tagName === 'IMG' && t.classList.contains('acmt-figure')) {
                window.open(t.src, '_blank', 'noopener');
            }
        });

        function initialize() {
            contentTitleEl.textContent = '참고자료 검색';
            contentSubtitleEl.textContent = '카테고리를 선택하거나 키워드로 검색하세요';
            contentDisplayEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">&#128218;</div>
                    <h3>카테고리 또는 키워드를 선택하세요</h3>
                    <p>좌측 메뉴에서 카테고리와 연도를 선택하시거나, 상단 검색창에서 키워드로 검색하세요.</p>
                </div>`;

            groupedData = fullTableData.reduce((acc, item) => {
                const category = item.category || '기타';
                const year = item.year || '연도 없음';
                if (!acc[category]) acc[category] = {};
                if (!acc[category][year]) acc[category][year] = [];
                acc[category][year].push(item);
                return acc;
            }, {});
            renderCategoryList();

            let debounceTimer;
            searchBoxEl.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => handleSearch(e), 200);
            });
        }

        function getCategoryItemCount(category) {
            if (!groupedData[category]) return 0;
            return Object.values(groupedData[category]).reduce((sum, arr) => sum + arr.length, 0);
        }

        function renderCategoryList() {
            const categoryOrder = Object.keys(dataRegistry);
            categoryListEl.innerHTML = '';
            categoryOrder.forEach(category => {
                if (!groupedData[category]) return;
                const { icon, color } = dataRegistry[category];
                const count = getCategoryItemCount(category);
                const categoryItem = document.createElement('li');
                categoryItem.className = 'category-item';
                categoryItem.innerHTML = `
                    <span>
                        <span class="cat-icon" style="background: ${color}15; color: ${color}">${icon}</span>
                        ${category}
                        <span class="cat-count">${count}</span>
                        <span class="chevron">&#9654;</span>
                    </span>
                    <ul class="year-list"></ul>`;
                categoryListEl.appendChild(categoryItem);
                categoryItem.querySelector('span').addEventListener('click', () => toggleCategory(category, categoryItem));
            });
        }

        function toggleCategory(category, categoryItemEl) {
            document.querySelectorAll('.category-item.active').forEach(item => {
                if (item !== categoryItemEl) {
                    item.classList.remove('active');
                    item.querySelector('.year-list').style.display = 'none';
                }
            });
            categoryItemEl.classList.toggle('active');
            const yearListEl = categoryItemEl.querySelector('.year-list');

            if (categoryItemEl.classList.contains('active')) {
                renderYearList(category, yearListEl);
                yearListEl.style.display = 'block';
                contentTitleEl.textContent = category;
                contentSubtitleEl.textContent = '연도를 선택하여 세부 내용을 확인하세요';
                contentDisplayEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">${dataRegistry[category].icon}</div>
                        <h3>${category}</h3>
                        <p>좌측에서 연도를 선택하여 세부 내용을 확인하세요.</p>
                    </div>`;
            } else {
                yearListEl.style.display = 'none';
            }
        }

        function renderYearList(category, yearListEl) {
            yearListEl.innerHTML = '';
            const years = Object.keys(groupedData[category]).sort((a, b) => b.localeCompare(a));
            for (const year of years) {
                const yearItem = document.createElement('li');
                yearItem.className = 'year-item';
                const yearText = (year === 'null' || year === '연도 없음') ? '연도 없음' : `${year}년`;
                const count = groupedData[category][year].length;
                yearItem.innerHTML = `<span>${yearText} <span class="year-count">${count}건</span></span>`;
                yearListEl.appendChild(yearItem);
                yearItem.querySelector('span').addEventListener('click', (event) => {
                    event.stopPropagation();
                    document.querySelectorAll('.year-item.active').forEach(item => item.classList.remove('active'));
                    yearItem.classList.add('active');
                    renderDetails(category, year);
                });
            }
        }

        function renderDetails(category, year) {
            const items = groupedData[category][year];
            const yearText = (year === 'null' || year === '연도 없음') ? '' : `${year}년`;
            contentTitleEl.innerHTML = `${category} ${yearText ? '- ' + yearText : ''} <span class="result-count">${items.length}건</span>`;
            contentSubtitleEl.textContent = '';
            let html = '<div class="details-list">';
            items.forEach(item => { html += createDetailItemHtml(item); });
            html += '</div>';
            contentDisplayEl.innerHTML = html;
        }

        function handleSearch(event) {
            const keyword = event.target.value.trim().toLowerCase();
            if (keyword.length < 2) {
                if (keyword.length === 0) {
                    contentTitleEl.textContent = '참고자료 검색';
                    contentSubtitleEl.textContent = '카테고리를 선택하거나 키워드로 검색하세요';
                    contentDisplayEl.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">&#128218;</div>
                            <h3>카테고리 또는 키워드를 선택하세요</h3>
                            <p>좌측 메뉴에서 카테고리와 연도를 선택하시거나, 상단 검색창에서 키워드로 검색하세요.</p>
                        </div>`;
                }
                return;
            }
            const results = fullTableData.filter(item => {
                const contentString = (typeof item.content === 'object' && item.content !== null)
                    ? Object.values(item.content).join(' ')
                    : String(item.content || '');
                return (item.title && item.title.toLowerCase().includes(keyword)) ||
                       contentString.toLowerCase().includes(keyword) ||
                       (item.related_tags && String(item.related_tags).toLowerCase().includes(keyword));
            });
            renderSearchResults(results, keyword);
        }

        function renderSearchResults(results, keyword) {
            contentTitleEl.innerHTML = `"${keyword}" 검색 결과 <span class="result-count">${results.length}건</span>`;
            contentSubtitleEl.textContent = '';
            if (results.length === 0) {
                contentDisplayEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">&#128533;</div>
                        <h3>검색 결과가 없습니다</h3>
                        <p>다른 키워드로 검색해 보세요.</p>
                    </div>`;
                return;
            }
            let html = '<div class="details-list search-results">';
            results.forEach(item => { html += createDetailItemHtml(item, keyword); });
            html += '</div>';
            contentDisplayEl.innerHTML = html;
        }

        function highlight(text, keyword) {
            if (!text || !keyword) return text;
            try {
                const regex = new RegExp(`(${keyword.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
                return text.replace(regex, '<mark>$1</mark>');
            } catch (e) { return text; }
        }

        // 고시 조문 전용 렌더러 — 법령 위계(조>항①>호1.>목가.>세목1))로 들여쓰기
        // 목 순번은 한글 순서(가~하) 다음 거~허·고~호로 이어짐(법령 표준 순차부호)
        const GOSI_MOK = '가나다라마바사아자차카타파하거너더러머버서어저처커터퍼허고노도로모보소오조초코토포호';
        const GOSI_MOK_RE = new RegExp('^[' + GOSI_MOK + ']\\.\\s?');
        function renderGosi(text, keyword) {
            return String(text).split('\n').map(function(raw) {
                const line = raw.trim();
                if (!line) return '';
                const h = highlight(line, keyword);
                // 조 제목(제N조(…))은 카드 제목(h3)과 중복이므로 본문에서는 생략
                if (/^제\d+조(?:의\d+)?\s*\(/.test(line)) return '';
                if (/^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕]/.test(line)) return `<span class="g-hang">${h}</span>`;
                if (/^\d{1,2}\.\s/.test(line)) return `<span class="g-ho">${h}</span>`;
                if (GOSI_MOK_RE.test(line)) return `<span class="g-mok">${h}</span>`;
                if (/^(\(?\d{1,2}\))\s?/.test(line)) return `<span class="g-semok">${h}</span>`;
                if (/^[※]/.test(line)) return `<span class="c-note">${h}</span>`;
                return `<span class="g-body">${h}</span>`;
            }).join('');
        }

        function renderContent(text, keyword, category) {
            if (category && category.includes('고시')) return renderGosi(text, keyword);
            return String(text).split('\n').map(function(raw) {
                const line = raw.trim();
                if (!line) return '';
                // Pass-through pre-built HTML tables / images (no per-line wrapping, no escape)
                if (/^<table\b/i.test(line)) return highlight(line, keyword);
                if (/^<img\b/i.test(line)) return line;
                const h = highlight(line, keyword);
                if (/^☞/.test(line)) return `<span class="c-result">${h}</span>`;
                if (/^■/.test(line)) return `<span class="c-part">${h}</span>`;
                if (/^□/.test(line)) return `<span class="c-head">${h}</span>`;
                if (/^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ][.\s]/.test(line)) return `<span class="c-head">${h}</span>`;
                if (/^<\s*\d+\s*안/.test(line) || /^<\s*참고/.test(line) || /^<[^>]{1,40}>$/.test(line))
                    return `<span class="c-sub">${h}</span>`;
                if (/^[※*]/.test(line)) return `<span class="c-note">${h}</span>`;
                if (/^[-–]\s?/.test(line)) return `<span class="c-b2">${h}</span>`;
                if (/^[ㅇ○◦●]\s?/.test(line) || /^[oO]\s/.test(line)) return `<span class="c-b1">${h}</span>`;
                if (/^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮]/.test(line)) return `<span class="c-b3">${h}</span>`;
                if (/^\d{1,2}[.)]\s/.test(line)) return `<span class="c-b1">${h}</span>`;
                return `<span class="c-line">${h}</span>`;
            }).join('');
        }

        function createDetailItemHtml(item, keyword = '') {
            let contentHtml = '';
            if (typeof item.content === 'string') {
                contentHtml = renderContent(item.content, keyword, item.category);
            } else if (item.content) {
                const KEY_LABELS = {
                    background: '현 황',
                    question: '질의 내용',
                    opinion: '질의자 의견',
                    answer: '답변 내용'
                };
                for (const key in item.content) {
                    const value = item.content[key];
                    if (!value || !String(value).trim()) continue;  // skip empty fields
                    const label = KEY_LABELS[key] || key.toUpperCase();
                    contentHtml += `<strong class="c-key">${label}</strong>` + renderContent(value, keyword);
                }
            }
            const tags = Array.isArray(item.related_tags) ? item.related_tags : (item.related_tags ? [item.related_tags] : []);
            const tagsHtml = tags.length
                ? `<div class="tags">${tags.map(t => `<span>${highlight(t, keyword)}</span>`).join('')}</div>`
                : '';
            const sourceLabel = getSourceLabel(item);
            const sourceHtml = sourceLabel
                ? `<div class="source"><span class="src-label">출처:</span> ${sourceLabel}</div>`
                : '';

            return `
                <div class="detail-item">
                    <h3>${highlight(item.title, keyword)}</h3>
                    <div class="meta">
                        ${item.year ? `<span class="badge-year">${item.year}</span>` : ''}
                        <span class="badge-category">${item.category}</span>
                        ${item.source_category ? `<span>${item.source_category}</span>` : ''}
                    </div>
                    <div class="content">${contentHtml}</div>
                    ${tagsHtml}
                    ${sourceHtml}
                </div>`;
        }

        // 출처 PDF 라벨 — 백업 폴더의 실제 파일명 매핑
        // 옛 연도(개별 PDF 없음)는 [자문단] 파일결합본.pdf로 표시
        // 출처 라벨 — 내용 검증 기반 매핑(2026-07). build_guideline_index.py get_source_pdf와 동일 로직.
        // 각 항목 본문을 in-project PDF 전문과 대조하여 실제 수록 위치를 확정('수록 위치 + 원 안건 출처').
        const _GF = {
            '2017.12': '[가이드라인]2017.12_영업보고서_작성_참고자료.pdf',
            '2018.03': '[가이드라인]2018.03_영업보고서_작성_참고자료.pdf',
            '2020.04': '[가이드라인]2020.04_영업보고서_작성_참고자료.pdf',
            '2021.05': '[가이드라인]2021.05_영업보고서_작성_참고자료.pdf',
            '2022.04': '[가이드라인]2022.04_영업보고서_작성_참고자료.pdf',
            '2023.04': '[가이드라인]2023.04_영업보고서_작성_참고자료.pdf'
        };
        const _HS = '[해설서]2026_회계분리기준_해설서(2026.4.).pdf';
        const _COMMITTEE = {'2012':'2017.12','2013':'2017.12','2014':'2017.12','2015':'2017.12','2016':'2017.12','2017':'2018.03','2018':'2020.04','2019':'2021.05','2020':'2022.04','2021':'2023.04','2022':'해설서','2023':'해설서','2024':'해설서'};
        const _QNA = {'2011':'해설서','2012':'2017.12','2013':'2017.12','2014':'2017.12','2015':'2017.12','2016':'2017.12','2017':'2018.03','2018':'2018.03','2019':'2020.04','2020':'2021.05','2021':'2022.04','2022':'2023.04','2023':'해설서','2024':'해설서'};
        const _ONEFILE = {'2014':'2017.12','2016':'2017.12','2018':'2020.04','2019':'2021.05','2020':'2022.04','2021':'2023.04','2022':'해설서'};
        function _pub(ver, y, section) {
            const base = (ver === '해설서') ? _HS : _GF[ver];
            return base ? `${base} 수록 — FY${y} ${section}` : null;
        }
        function getSourceLabel(item) {
            // 전수 감사(본문 대조)로 entry별 확정된 출처가 있으면 최우선 사용
            if (item.source_pdf) return item.source_pdf;
            const cat = item.category || '';
            const y = item.year ? String(item.year) : '';
            const co = item.source_company || '';

            if (cat.includes('고시')) {
                return '[고시]전기통신사업 회계분리기준(과학기술정보통신부고시)(제2025-23호).pdf';
            }
            if (cat.includes('영업보고서 검증') || cat.includes('지적사항')) {
                return `${_HS} 수록 — FY${y} 영업보고서 검증결과 지적사항 (조문별)`;
            }
            if (cat.includes('회계전문위원회')) {
                return _pub(_COMMITTEE[y], y, '회계전문위원회 회의 결과')
                    || `[자문단] FY${y} 회계전문위원회 회의 결과 (프로젝트 외 원본)`;
            }
            if (cat.includes('회계처리 일원화')) {
                return _pub(_ONEFILE[y], y, '회계처리 일원화 방안')
                    || `[자문단] FY${y} 회계처리 일원화 방안 (프로젝트 외 원본)`;
            }
            if (cat.includes('질의')) {
                if (y === '2020' && co === 'SK브로드밴드') {
                    return '[사전질의]2020회계연도전기통신사업회계제도질의답변서_SK브로드밴드(배포용).pdf (프로젝트 외 원본)';
                }
                if (y === '2025' && co) {
                    return `[질의회신]2025회계연도 전기통신사업 회계제도 질의 답변서_${co}.pdf (프로젝트 외 원본)`;
                }
                const lbl = _pub(_QNA[y], y, '질의회신');
                if (lbl) return lbl;
                const coLabel = co ? ` _${co}` : '';
                return `[질의회신] FY${y}${coLabel} (프로젝트 외 원본, 출처 미상)`;
            }
            const guideVer = {'2016':'2017.12','2017':'2018.03','2019':'2020.04','2020':'2021.05','2021':'2022.04','2022':'2023.04'}[y];
            if (cat.includes('영업보고서 작성 주의')) {
                return _pub(guideVer, y, '작성 주의사항') || `[가이드라인] FY${y} 작성 주의사항 (출처 확인 필요)`;
            }
            if (cat === '참고자료' || cat.includes('참고자료')) {
                return _pub(guideVer, y, '참고자료') || `[가이드라인] FY${y} 참고자료 (출처 확인 필요)`;
            }
            if (cat.includes('해설서')) {
                return _HS;
            }
            return '';
        }

        // ═══ AI 질의 (로컬 Ollama + 전체 본문 검색) ═══
        // 판정 지식은 indexer/ollama_tag.py SYSTEM_KNOWLEDGE와 동일 취지 (갱신 시 함께 수정)
        const QA_SYSTEM = `당신은 전기통신사업 회계분리기준(과기정통부 고시)·해설서·회계전문위원회 결정에 정통한 회계법인 외부검증인이다.
사용자의 질문에 한국어로 간결하고 정확하게 답하라.

## 확립된 핵심 지식 (최우선 근거)
- 낙전수입(쿠폰·선불 미사용 소멸)은 '기타영업수익' 형태가 적정 (FY2013 자문단 결정, FY2019 지적)
- 임대폰·모뎀·AP 등 장치 임대 사용료와 그 위약금은 '장치비수익' 형태가 적정 (FY2022·2023·2024 지적)
- 요금할인 해지위약금은 '기타요금수익' (FY2016·2019·2021 지적)
- 사은품 반환금·연체료·연체가산금은 '기타영업수익' (FY2015~2020 지적)
- MVNO 판매활성화장려금 — 받는 쪽(MVNO)은 '기타영업수익' 총액 인식(순액 차감 금지, FY2018·2019 지적)이며 역무 할당은 월별 신규가입자 수 비율(FY2024 전문위). 주는 쪽(MNO)은 수익이 아니라 비용 — 판매영업기능(광고선전비외의 판매촉진비)이며 역무 배부는 도매제공수익 비율(FY2024 전문위)
- OutBound 국제로밍·에그 활용 로밍 수익은 '기타요금수익' (FY2020·2024), InBound 로밍은 '정액요금수익' (FY2021)
- 기본료의 형태는 약관 성격 기준: 종량제→기본료(종량제요금수익), 정액제→정액요금수익 (FY2019·2022 지적)
- SMS/MMS 수익은 종량/초과_SMS/MMS 형태가 적정 (FY2019·2020 지적)
- 매출에누리·매출할인은 원 수익의 차감 — 원 수익과 동일 형태 준용이 적정
- K-IFRS1115호 수익 이연 등 발생주의 조정 전표는 표준계정코드(P9010 등) 분류로 통신회계에서 제외 (FY2019 표준계정 매뉴얼)
- 공통역무 풀: 원장 계상은 허용되나 ① 개별 역무로 특정 가능한 수익을 공통에 두면 지적(FY2020) ② 기말 미배부 잔존 시 지적 ③ 공통이 정당하면 매출액 비율 등 합리적 배부기준을 지침서에 명시·배부 (FY2013 자문단). 최종 영업보고서에 공통(서비스공통미배부)이 남으면 안 됨.

## 답변 규칙
- 위 핵심 지식과 '관련 조항' 발췌를 근거로 답하고, 연도를 인용하라 (예: FY2020 지적사항).
- 관련 조항이 질문과 무관해 보이면 억지로 인용하지 말고 핵심 지식·일반 원칙으로만 답하라.
- 확실하지 않으면 단정하지 말고 확인이 필요하다고 답하라.
- 답변은 10문장 이내.`;

        function qaSearch(q, K = 5) {
            const tokens = q.split(/[\s,.?!·()\[\]"']+/).filter(t => t.length >= 2);
            // 조문 번호 패턴 (조사 무관 매칭: "제9조는" → "제9조")
            const arts = q.match(/제\d+조(?:의\d+)?/g);
            if (arts) tokens.push(...arts);
            const scored = [];
            for (const item of fullTableData) {
                const content = typeof item.content === 'string' ? item.content : JSON.stringify(item.content || '');
                let score = 0;
                for (const t of tokens) {
                    // 조문 번호는 제목 일치 시 고가중 (저신뢰 컷을 확실히 넘김)
                    if (item.title && item.title.includes(t)) score += (arts && arts.includes(t)) ? 15 : 5;
                    if (content.includes(t)) score += 2;
                }
                if (score > 0) scored.push({ item, score, content });
            }
            scored.sort((a, b) => b.score - a.score);
            // 저신뢰 차단 — 무관 조항 억지 인용 방지
            return scored.slice(0, K).filter(s => s.score >= 9);
        }

        function qaExcerpt(content, tokens) {
            const concl = content.split('\n').filter(l => l.includes('☞')).slice(0, 2).join(' ');
            let ctx = '';
            for (const t of tokens) {
                const i = content.indexOf(t);
                if (i >= 0) { ctx = content.slice(Math.max(0, i - 60), i + 160).replace(/\s+/g, ' '); break; }
            }
            return ((ctx ? ctx + ' … ' : '') + (concl || '')).slice(0, 280);
        }

        function renderQAPanel() {
            contentTitleEl.textContent = 'AI에게 질문';
            contentSubtitleEl.textContent = '가이드라인 전체(본문 포함)를 검색해 로컬 AI가 근거와 함께 답합니다 — 질문은 이 PC를 벗어나지 않습니다';
            const savedModel = localStorage.getItem('qa-model') || 'qwen3:14b';
            contentDisplayEl.innerHTML = `
                <div class="detail-item qa-panel">
                    <textarea id="qa-input" placeholder="예) 낙전수입의 형태 분류는? / 공통역무가 기말에 남아 있으면 안 되나요? / 고시 제9조 내용은? (Ctrl+Enter 실행)"></textarea>
                    <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
                        <button class="qa-ask" id="qa-ask" style="margin-top:0">질문하기</button>
                        <label style="font-size:0.75rem;color:var(--text-muted)">모델:
                            <input id="qa-model" value="${savedModel}" style="width:95px;padding:5px 7px;font-size:0.78rem;border:1px solid var(--border);border-radius:5px">
                        </label>
                        <span style="font-size:0.7rem;color:var(--text-muted)">qwen3:8b(빠름) / qwen3:14b(정확)</span>
                    </div>
                    <div id="qa-out"></div>
                </div>`;
            const btn = document.getElementById('qa-ask');
            const input = document.getElementById('qa-input');
            btn.addEventListener('click', askOllama);
            input.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) askOllama(); });
            input.focus();
        }

        async function askOllama() {
            const q = document.getElementById('qa-input').value.trim();
            const out = document.getElementById('qa-out');
            const btn = document.getElementById('qa-ask');
            if (!q) { out.innerHTML = '<div class="qa-note">질문을 입력하세요.</div>'; return; }
            btn.disabled = true; btn.textContent = '답변 생성 중...';
            out.innerHTML = '<div class="qa-refs">지식베이스 검색 중...</div>';
            try {
                const tokens = q.split(/[\s,.?!·()\[\]"']+/).filter(t => t.length >= 2);
                const refs = qaSearch(q, 5);
                const refTxt = refs.map((m, i) =>
                    `${i + 1}) [${m.item.category} ${m.item.year}] ${m.item.title.slice(0, 60)}\n${qaExcerpt(m.content, tokens)}`
                ).join('\n\n');
                const prompt = `질문: ${q}\n\n관련 조항(지식베이스 검색 결과):\n${refTxt || '(신뢰도 있는 매칭 없음 — 핵심 지식과 일반 원칙으로만 답하고, 조항을 지어내지 말 것)'}\n\n위 근거를 바탕으로 답하라.`;
                out.innerHTML = '<div class="qa-refs">로컬 AI 답변 생성 중... (수십 초)</div>';
                const model = (document.getElementById('qa-model').value || 'qwen3:14b').trim();
                localStorage.setItem('qa-model', model);
                const resp = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model, prompt, system: QA_SYSTEM, stream: false, think: false,
                                           options: { temperature: 0.2, num_predict: 600 } })
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                let html = `<div class="qa-answer">${escapeHtmlQA(data.response || '(응답 없음)')}</div>`;
                if (refs.length) {
                    html += `<div class="qa-refs"><b>참고한 조항</b> (클릭해 원문 검색):<br>` + refs.map(m =>
                        `· <a href="#" onclick="document.getElementById('search-box').value='${escapeHtmlQA(m.item.title.slice(0, 20))}';document.getElementById('search-box').dispatchEvent(new Event('input'));return false;">[${escapeHtmlQA(m.item.category)} ${escapeHtmlQA(String(m.item.year))}] ${escapeHtmlQA(m.item.title.slice(0, 55))}</a> <span style="color:#aab">(${escapeHtmlQA(getSourceLabel(m.item))})</span>`
                    ).join('<br>') + `</div>`;
                }
                html += `<div class="qa-note">※ 로컬 8B 모델의 초안 답변입니다 — 중요한 판단은 원문 조항·검증인 확인을 거치세요.</div>`;
                out.innerHTML = html;
            } catch (ex) {
                out.innerHTML = `<div class="qa-note">Ollama 연결 실패: ${escapeHtmlQA(ex.message || String(ex))}<br>
                    ① 이 PC에서 Ollama가 실행 중인지 확인하세요 (시작 메뉴 → Ollama)<br>
                    ② GitHub Pages(https)에서는 브라우저가 로컬 연결을 차단할 수 있습니다 — 이 경우 오프라인 번들 파일 또는 로컬로 연 페이지에서 사용하세요.</div>`;
            }
            btn.disabled = false; btn.textContent = '질문하기';
        }

        function escapeHtmlQA(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;');
        }

        // 페이지 로딩 시작
        document.addEventListener('DOMContentLoaded', () => {
            loadAllDataFiles(initialize);
            document.getElementById('qa-open').addEventListener('click', renderQAPanel);
        });
    </script>
